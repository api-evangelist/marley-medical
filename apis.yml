name: Marley Medical
description: >-
  Marley Medical is a venture-backed (Andreessen Horowitz / a16z) digital health
  company that delivers virtual, membership-based medical care to patients directly
  through a consumer web and mobile experience. Its patient-facing product runs as a
  web application (member portal at my.marleymedical.com) backed by Google Firebase,
  fronted by a Webflow marketing site and signup funnel, with member support delivered
  through Zendesk and transactional email via Mailgun on Google Workspace. As of this
  enrichment pass Marley Medical operates as a direct-to-consumer telehealth service and
  does not publish a public developer API, OpenAPI definition, SDKs, or developer portal;
  this profile captures its verified public web and email infrastructure and its
  domain-security posture.
